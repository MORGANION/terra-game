<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="glow" cx="80" cy="80" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c92a3a" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#c92a3a" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#ff5a6e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#c92a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fill" cx="80" cy="80" r="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c92a3a" stop-opacity="0.25"/>
      <stop offset="0.8" stop-color="#c92a3a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c92a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="80" cy="80" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a6e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c92a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft halo + translucent fill -->
  <circle cx="80" cy="80" r="78" fill="url(#glow)"/>
  <circle cx="80" cy="80" r="74" fill="url(#fill)"/>
  <circle cx="80" cy="80" r="26" fill="url(#core)"/>

  <!-- outer ring -->
  <circle cx="80" cy="80" r="64" fill="none" stroke="#c92a3a" stroke-width="6" stroke-opacity="0.9"/>
  <path d="M17 68.9 A64 64 0 0 1 68.9 17" fill="none" stroke="#ff5a6e" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M143 91.1 A64 64 0 0 1 91.1 143" fill="none" stroke="#8f1d2b" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- second bright ring -->
  <circle cx="80" cy="80" r="55" fill="none" stroke="#ff5a6e" stroke-width="3" stroke-opacity="0.85"/>

  <!-- inner ring -->
  <circle cx="80" cy="80" r="26" fill="none" stroke="#ff5a6e" stroke-width="4" stroke-opacity="0.9"/>

  <!-- symbols -->
  <g stroke="#ff5a6e" stroke-linejoin="round" stroke-linecap="round">
    <!-- triangle 0 -->
    <path d="M80 31 L90 49 L70 49 Z" fill="#ff5a6e" fill-opacity="0.3" stroke-width="3.5"/>
    <!-- eye 60 -->
    <g transform="rotate(60 80 80)">
      <path d="M67 40 Q80 28 93 40 Q80 52 67 40 Z" fill="#c92a3a" fill-opacity="0.4" stroke-width="3.5"/>
      <circle cx="80" cy="40" r="4" fill="#ff5a6e" stroke="none"/>
    </g>
    <!-- crescent 120 -->
    <g transform="rotate(120 80 80)">
      <path d="M85 29 A11 11 0 0 0 85 51 A14 14 0 0 1 85 29 Z" fill="#ff5a6e" stroke-width="2"/>
    </g>
    <!-- triangle 180 -->
    <g transform="rotate(180 80 80)">
      <path d="M80 31 L90 49 L70 49 Z" fill="#ff5a6e" fill-opacity="0.3" stroke-width="3.5"/>
    </g>
    <!-- eye 240 -->
    <g transform="rotate(240 80 80)">
      <path d="M67 40 Q80 28 93 40 Q80 52 67 40 Z" fill="#c92a3a" fill-opacity="0.4" stroke-width="3.5"/>
      <circle cx="80" cy="40" r="4" fill="#ff5a6e" stroke="none"/>
    </g>
    <!-- crescent 300 -->
    <g transform="rotate(300 80 80)">
      <path d="M85 29 A11 11 0 0 0 85 51 A14 14 0 0 1 85 29 Z" fill="#ff5a6e" stroke-width="2"/>
    </g>
  </g>

  <!-- center mark -->
  <circle cx="80" cy="80" r="7" fill="#ff5a6e" fill-opacity="0.9"/>
</svg>