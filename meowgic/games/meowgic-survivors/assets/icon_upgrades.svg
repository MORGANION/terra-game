<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc933" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc933" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f55d8"/>
      <stop offset="1" stop-color="#6b34b3"/>
    </linearGradient>
  </defs>

  <!-- ореол стрелки (без обводки) -->
  <circle cx="49" cy="23" r="26" fill="url(#glow)"/>

  <!-- страницы -->
  <rect x="20" y="48" width="68" height="42" rx="7" fill="#fff1d6" stroke="#12081f" stroke-width="4" stroke-linejoin="round"/>

  <!-- обложка -->
  <rect x="10" y="44" width="68" height="42" rx="7" fill="url(#cover)" stroke="#12081f" stroke-width="4" stroke-linejoin="round"/>

  <!-- золотая окантовка -->
