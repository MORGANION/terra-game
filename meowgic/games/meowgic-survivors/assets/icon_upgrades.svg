  <!-- застёжка -->
  <circle cx="44" cy="65" r="7" fill="#ffc933" stroke="#12081f" stroke-width="3" stroke-linejoin="round"/>

  <!-- стрелка вверх -->
  <path d="M49 6 L68 28 L57 28 L57 38 L41 38 L41 28 L30 28 Z" fill="#ffc933" stroke="#12081f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- блик -->
  <path d="M49 14 L39 26 L46 26 Z" fill="#ffe27a"/>
  <!-- тень -->
  <rect x="52" y="30" width="3" height="6" rx="1.5" fill="#e8a800"/>
