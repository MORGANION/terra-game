<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- корпус коробки -->
    <rect x="15" y="52" width="66" height="36" rx="7" fill="#b565f0"/>
    <!-- тень под крышкой -->
    <path d="M15 54H81V63H15Z" fill="#7b3fc4"/>
    <!-- лента на корпусе -->
    <rect x="40" y="52" width="16" height="36" fill="#ffc933" stroke="#12081f" stroke-width="4"/>
    <!-- обводка корпуса -->
    <rect x="15" y="52" width="66" height="36" rx="7" fill="none" stroke="#12081f" stroke-width="4"/>
    <!-- крышка -->
    <rect x="10" y="34" width="76" height="20" rx="6" fill="#b565f0" stroke="#12081f" stroke-width="4"/>
    <!-- блик на крышке -->
    <rect x="16" y="39" width="18" height="5" rx="2.5" fill="#d9a8ff"/>
    <!-- лента на крышке -->
    <rect x="40" y="34" width="16" height="20" fill="#ffc933" stroke="#12081f" stroke-width="4"/>
    <!-- кошачьи ушки -->
    <path d="M22 24L26 8L40 19Z" fill="#ffc933" stroke="#12081f" stroke-width="4"/>
    <path d="M74 24L70 8L56 19Z" fill="#ffc933" stroke="#12081f" stroke-width="4"/>
    <!-- петли банта -->
    <ellipse cx="33" cy="28" rx="13" ry="9" fill="#ffc933" stroke="#12081f" stroke-width="4"/>
    <ellipse cx="63" cy="28" rx="13" ry="9" fill="#ffc933" stroke="#12081f" stroke-width="4"/>
    <!-- внутренняя часть ушек -->
    <path d="M26 13L25 17.5H30Z" fill="#7b3fc4"/>
    <path d="M70 13L71 17.5H66Z" fill="#7b3fc4"/>
    <!-- узел банта -->
    <circle cx="48" cy="29" r="7.5" fill="#ffc933" stroke="#12081f" stroke-width="4"/>
  </g>
</svg>