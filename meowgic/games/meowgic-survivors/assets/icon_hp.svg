<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <clipPath id="heartClip">
      <path d="M48 84 C20 64 8 50 8 36 C8 24 17 18 27 18 C36 18 43 23 48 30 C53 23 60 18 69 18 C79 18 88 24 88 36 C88 50 76 64 48 84 Z"/>
    </clipPath>
  </defs>

  <!-- ears (behind the heart) -->
  <path d="M12 36 L13 8 L38 22 Z" fill="#e63950" stroke="#12081f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M84 36 L83 8 L58 22 Z" fill="#e63950" stroke="#12081f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M19 31 L19.5 16 L31 23 Z" fill="#ff7a8a" stroke="#ff7a8a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M77 31 L76.5 16 L65 23 Z" fill="#ff7a8a" stroke="#ff7a8a" stroke-width="2" stroke-linejoin="round"/>

  <!-- heart base = shadow tone -->
  <path d="M48 84 C20 64 8 50 8 36 C8 24 17 18 27 18 C36 18 43 23 48 30 C53 23 60 18 69 18 C79 18 88 24 88 36 C88 50 76 64 48 84 Z" fill="#a01f35"/>

  <!-- main fill shifted up-left, clipped: leaves a shadow at the bottom-right -->
  <g clip-path="url(#heartClip)">
    <path transform="translate(-3 -5)" d="M48 84 C20 64 8 50 8 36 C8 24 17 18 27 18 C36 18 43 23 48 30 C53 23 60 18 69 18 C79 18 88 24 88 36 C88 50 76 64 48 84 Z" fill="#e63950"/>
  </g>

  <!-- soft highlight -->
  <ellipse cx="25" cy="33" rx="9" ry="5.5" transform="rotate(-35 25 33)" fill="#ff7a8a"/>
  <!-- small white glint -->
  <circle cx="19" cy="42" r="2.5" fill="#fff8ee"/>

  <!-- heart outline on top -->
  <path d="M48 84 C20 64 8 50 8 36 C8 24 17 18 27 18 C36 18 43 23 48 30 C53 23 60 18 69 18 C79 18 88 24 88 36 C88 50 76 64 48 84 Z" fill="none" stroke="#12081f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
</svg>