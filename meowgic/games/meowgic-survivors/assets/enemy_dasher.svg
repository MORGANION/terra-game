<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b565f0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b565f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2466"/>
      <stop offset="0.5" stop-color="#2a1740"/>
      <stop offset="1" stop-color="#22123a"/>
    </linearGradient>
  </defs>

  <!-- speed streaks (no outline) -->
  <g stroke-linecap="round" fill="none" stroke="url(#streak)">
    <line x1="19" y1="34" x2="19" y2="60" stroke-width="3.5"/>
    <line x1="45" y1="34" x2="45" y2="60" stroke-width="3.5"/>
    <line x1="32" y1="53" x2="32" y2="63" stroke-width="3"/>
  </g>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M32 46 C30 51 36 52 32 57" fill="none" stroke="#12081f" stroke-width="7"/>
    <path d="M32 46 C30 51 36 52 32 57" fill="none" stroke="#2a1740" stroke-width="2"/>

    <!-- ears -->
    <path d="M27 22 L13 8 L18 30 Z" fill="#2a1740" stroke="#12081f" stroke-width="3"/>
    <path d="M37 22 L51 8 L46 30 Z" fill="#2a1740" stroke="#12081f" stroke-width="3"/>
    <path d="M25.5 22 L17 13 L20 25 Z" fill="#ff4fa3"/>
    <path d="M38.5 22 L47 13 L44 25 Z" fill="#ff4fa3"/>

    <!-- body -->
    <path d="M32 5 C38 11 41 21 40 31 C39 39 35 45 32 47 C29 45 25 39 24 31 C23 21 26 11 32 5 Z" fill="url(#body)" stroke="#12081f" stroke-width="3"/>

    <!-- highlight (top-left) -->
    <path d="M28.5 12 C26.5 17 26 23 26.5 29" fill="none" stroke="#5a3a8c" stroke-width="2" opacity="0.8"/>

    <!-- back stripe -->
    <path d="M32 25 L32 40" fill="none" stroke="#ff4fa3" stroke-width="2.5"/>
  </g>

  <!-- eyes -->
  <circle cx="28.3" cy="16" r="2.2" fill="#ff3b5c"/>
  <circle cx="35.7" cy="16" r="2.2" fill="#ff3b5c"/>
  <circle cx="27.7" cy="15.4" r="0.7" fill="#fff8ee"/>
  <circle cx="35.1" cy="15.4" r="0.7" fill="#fff8ee"/>
</svg>