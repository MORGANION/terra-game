<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <path id="leaf" d="M0 0 C-4 -4 -17 -10 -17 -22 C-17 -31 -6 -33 0 -26 C6 -33 17 -31 17 -22 C17 -10 4 -4 0 0 Z"/>
    <clipPath id="leaves">
      <use href="#leaf" transform="translate(38 56) rotate(45) scale(.8)"/>
      <use href="#leaf" transform="translate(38 56) rotate(135) scale(.8)"/>
      <use href="#leaf" transform="translate(38 56) rotate(225) scale(.8)"/>
      <use href="#leaf" transform="translate(38 56) rotate(315) scale(.8)"/>
    </clipPath>
    <radialGradient id="glow" cx="72" cy="24" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc933" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffc933" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glow of the crit star -->
  <circle cx="72" cy="24" r="22" fill="url(#glow)"/>

  <!-- stem -->
  <path d="M38 60 C39 72 38 80 32 87" fill="none" stroke="#12081f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 60 C39 72 38 80 32 87" fill="none" stroke="#2a9d55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- leaf fills -->
  <g fill="#4cd97b">
    <use href="#leaf" transform="translate(38 56) rotate(45) scale(.8)"/>
    <use href="#leaf" transform="translate(38 56) rotate(135) scale(.8)"/>
    <use href="#leaf" transform="translate(38 56) rotate(225) scale(.8)"/>
    <use href="#leaf" transform="translate(38 56) rotate(315) scale(.8)"/>
  </g>

  <!-- shadow (bottom-right) -->
  <path d="M76 36 Q48 56 16 80 L16 96 L96 96 L96 36 Z" fill="#2a9d55" clip-path="url(#leaves)"/>

  <!-- leaf outlines -->
  <g fill="none" stroke="#12081f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <use href="#leaf" transform="translate(38 56) rotate(45) scale(.8)"/>
    <use href="#leaf" transform="translate(38 56) rotate(135) scale(.8)"/>
    <use href="#leaf" transform="translate(38 56) rotate(225) scale(.8)"/>
    <use href="#leaf" transform="translate(38 56) rotate(315) scale(.8)"/>
  </g>

  <!-- single white highlight -->
  <path d="M4.5 -26 C5.5 -28 7.5 -29 9.5 -28.8" transform="translate(38 56) rotate(315) scale(.8)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- crit star -->
  <path d="M72 9 L76.7 17.5 L86.3 19.4 L79.6 26.5 L80.8 36.1 L72 32 L63.2 36.1 L64.4 26.5 L57.7 19.4 L67.3 17.5 Z" fill="#ffc933" stroke="#12081f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
</svg>