  <path d="M74 52 V58 A26 26 0 0 1 66.4 76.4" fill="none" stroke="#8f1d29" stroke-width="3" stroke-linecap="round"/>

  <!-- наконечники -->
  <rect x="18" y="26" width="16" height="22" rx="3" fill="#cfe8ff" stroke="#12081f" stroke-width="4" stroke-linejoin="round"/>
  <rect x="62" y="26" width="16" height="22" rx="3" fill="#cfe8ff" stroke="#12081f" stroke-width="4" stroke-linejoin="round"/>
  <rect x="22" y="30" width="3" height="9" rx="1.5" fill="#fff8ee"/>
  <rect x="66" y="30" width="3" height="9" rx="1.5" fill="#fff8ee"/>
  <rect x="29" y="33" width="3" height="11" rx="1.5" fill="#9cc3e6"/>
  <rect x="73" y="33" width="3" height="11" rx="1.5" fill="#9cc3e6"/>

  <!-- монетки -->
  <g stroke="#12081f" stroke-width="4" stroke-linejoin="round">
    <circle cx="24" cy="13" r="7" fill="#ffc933"/>
    <circle cx="72" cy="13" r="7" fill="#ffc933"/>
    <circle cx="48" cy="21" r="8" fill="#ffc933"/>
  </g>
  <g fill="#fff8ee" opacity="0.85">
