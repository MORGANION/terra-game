<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- мягкий ореол притяжения (без обводки) -->
  <circle cx="48" cy="22" r="26" fill="url(#halo)"/>

  <!-- дуги притяжения -->
